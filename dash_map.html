#map{position:absolute;top:0;bottom:0;left:0;right:0}
.box{position:absolute;z-index:1000;background:#fff;border:1px solid #d8dde3;border-radius:9px;padding:10px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#title{top:10px;left:10px;max-width:300px}#title h1{font-size:14px;margin:0 0 3px}#title p{margin:0;color:#6b7686;font-size:11px}
#leg{bottom:18px;left:10px}#leg b{font-size:12px}

.legrow:hover{background:#eef1f4}.legrow.off{opacity:.3}.legrow.solo{background:#e8eef6;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#reset{margin-top:6px;font-size:11px;color:#1F3864;cursor:pointer;text-decoration:underline}
.lbl{font-size:10px;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;font-weight:600;background:transparent;border:none;box-shadow:none}
#panel{position:absolute;top:0;right:0;bottom:0;width:370px;max-width:88vw;background:#fff;z-index:1200;box-shadow:-3px 0 16px rgba(0,0,0,.18);transform:translateX(100%);transition:.22s;overflow-y:auto;padding:18px 18px 40px}
#panel.open{transform:translateX(0)}
#pclose{position:absolute;top:12px;right:14px;font-size:24px;color:#888;cursor:pointer;background:none;border:none}
#panel h2{font-size:18px;margin:0 4px 2px 0}.psub{color:#6b7686;font-size:12px;margin:0 0 10px}
.badge{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:11px;margin:2px 4px 2px 0}
.sec{margin-top:14px}.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#6b7686;margin:0 0 6px;border-bottom:1px solid #e3e6ea;padding-bottom:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}.kv div:nth-child(odd){color:#6b7686;font-weight:600}
.bi{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11.5px}
.bi .t{flex:1}.bi .tr{width:70px;height:11px;background:#eef1f4;border-radius:4px;overflow:hidden}.bi .fl{height:100%}
.chip{display:inline-block;font-size:11px;background:#eef1f4;color:#46505e;border-radius:6px;padding:2px 8px;margin:2px 3px 0 0}
.chip.hi{background:#fde2e1;color:#b03a2e}.chip.md{background:#fdf0d8;color:#9a6a12}
.trait{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}
.trait .bar{flex:1;height:13px;background:#eef1f4;border-radius:4px;overflow:hidden;position:relative}
.trait .bar i{display:block;height:100%;background:#9bb3d4}.trait.enr .bar i{background:#C6531B}
.trait .pct{width:96px;text-align:right;color:#6b7686;font-size:11px}
.enrtag{color:#C6531B;font-weight:700;font-size:10px;margin-left:3px}
.note{background:#fff7ed;border:1px solid #f3d6ad;border-radius:7px;padding:7px 9px;font-size:11px;color:#8a5a14;margin-top:8px}

function openFarm(name){

function openLineage(lin){
