  .axis-bg-1 { fill: #fdeaea; opacity: 0.5; } /* High High */
  .axis-bg-2 { fill: #fdf0d8; opacity: 0.5; } /* Low High */
  .axis-bg-3 { fill: #eef4ef; opacity: 0.6; } /* Low Low (Safe) */
  .axis-bg-4 { fill: #fdf0d8; opacity: 0.5; } /* High Low */
  .axis-label { font-size: 13px; font-weight: 700; fill: #1f2733; text-anchor: middle; }

  .f-score .txt { font-size: 14px; color: var(--mut); }
  
  .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-bottom: 16px; margin-right: 6px; }
  .bg-red { background: #fdeaea; color: #a8322a; }
  .bg-orange { background: #fdf0d8; color: #9a6a12; }
  .bg-green { background: #eef4ef; color: #1e7e34; }
  .bg-blue { background: #eef2f7; color: #1F3864; }
  
  .f-section { margin-bottom: 20px; }
  .f-section h3 { font-size: 13px; color: var(--mut); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .f-section .box { font-size: 14px; background: #f8f9fb; padding: 12px; border-radius: 8px; border: 1px solid #eef1f4; margin-bottom: 8px; }
  .action { border-left: 3px solid var(--accent); }
  
  ul { margin: 0; padding-left: 20px; }

      const dist = Math.sqrt(d.extRisk*d.extRisk + d.intRisk*d.intRisk);
      // min dist is rank 1
      const allDist = data.map(x => Math.sqrt(x.extRisk*x.extRisk + x.intRisk*x.intRisk)).sort((a,b)=>a-b);
      const rank = allDist.indexOf(dist) + 1;
      const pct = Math.round((rank / data.length) * 100);
      return {rank, pct};
  }

  // === 최저위험 기준농장 & 격차분석 ===
  // 기준농장 = 내·외부 위험 합산이 가장 낮은(가장 안전한) 농장
  const benchmark = data.reduce((a,b) => (b.extRisk + b.intRisk) < (a.extRisk + a.intRisk) ? b : a);
  const LV_NUM = {'이상':0, 'low':1, 'medium':2, 'high':3};
  const LV_KR  = {'이상':'해당없음', 'low':'낮음', 'medium':'중간', 'high':'높음'};
  function rangeOf(key){
      const vs = data.map(d => d[key]).filter(v => typeof v === 'number');
      return (Math.max(...vs) - Math.min(...vs)) || 1;
  }
  const RANGES = {extRisk:rangeOf('extRisk'), intRisk:rangeOf('intRisk'), ext_bio:rangeOf('ext_bio'), int_bio:rangeOf('int_bio'), nearby:rangeOf('nearby')};

  // 클릭농장 vs 기준농장의 항목별 격차(클릭농장이 더 나쁠수록 raw/norm 큼)
  function gapFactors(d){
      const f = [];
      const numF = (key,label,better,fmt,action) => {
          const cur = d[key], tgt = benchmark[key];
          if(typeof cur !== 'number' || typeof tgt !== 'number') return;
          const diff = better === 'low' ? cur - tgt : tgt - cur;
          f.push({label, cur:fmt(cur), tgt:fmt(tgt), raw:Math.max(0,diff), norm:Math.max(0,diff)/RANGES[key], action});
      };
      const catF = (key,label,action) => {
          const cur = LV_NUM[d[key]], tgt = LV_NUM[benchmark[key]];
          if(cur == null || tgt == null) return;
          const diff = cur - tgt;
          f.push({label, cur:LV_KR[d[key]], tgt:LV_KR[benchmark[key]], raw:Math.max(0,diff), norm:Math.max(0,diff)/3, action});
      };
      numF('ext_bio','외부 차단방역 수준','high', v=>v.toFixed(0)+'점', '외부 울타리·방역실·차량소독 등 외부 차단방역을 기준농장 수준으로 강화');
      numF('int_bio','내부 차단방역 수준','high', v=>v.toFixed(0)+'점', '돈사별 전용 장비·장화 교체·올인올아웃 등 내부 차단방역 강화');
      numF('nearby','3km 인접 농장 수','low', v=>v+'개', '입지는 변경 불가 — 사료·출하 차량 동선분리 및 외부 통제벽으로 교차오염 차단');
      catF('gilt','후보돈 도입 위험', '후보돈 자가생산 또는 입식 전 격리·검사(2~4주) SOP 도입');
      catF('veh','차량 출입 위험', '출하·사료 차량 진입 통제 및 거점소독시설 경유 의무화');
      catF('resid','내부 잔존바이러스', '전체 두수 청정화(검사·도태)와 올인올아웃으로 순환고리 차단');
      return f;
  }

  // 격차 막대 (val: 위험 격차, range: 전체 농장 분포폭)
  function gapBar(label, val, range, color){
      const pct = Math.min(100, range ? val/range*100 : 0);
      return `<div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">
          <span>${label}</span><span style="font-weight:700;color:${color}">+${val.toFixed(1)}</span></div>
        <div style="height:8px;background:#eef1f4;border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;"></div></div>
      </div>`;
  }

  function draw() {
    const w = svg.clientWidth;
    const h = svg.clientHeight;
    const padding = 50;
    
    // Scales
    const scaleX = val => padding + (val - xMin) / (xMax - xMin) * (w - padding * 2);
    const scaleY = val => h - padding - (val - yMin) / (yMax - yMin) * (h - padding * 2);
    
    const ox = scaleX(originX);
    const oy = scaleY(originY);
    
    svg.innerHTML = '';
    
    // Quadrant Backgrounds
    const quads = [
      {x: ox, y: padding, w: w-padding-ox, h: oy-padding, class: 'axis-bg-1'}, // Q1: High Ext, High Int
      {x: padding, y: padding, w: ox-padding, h: oy-padding, class: 'axis-bg-2'}, // Q2: Low Ext, High Int
      {x: padding, y: oy, w: ox-padding, h: h-padding-oy, class: 'axis-bg-3'}, // Q3: Low Ext, Low Int
      {x: ox, y: oy, w: w-padding-ox, h: h-padding-oy, class: 'axis-bg-4'}  // Q4: High Ext, Low Int
    ];
    
    quads.forEach(q => {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', q.x); rect.setAttribute('y', q.y);
      rect.setAttribute('width', Math.max(0, q.w)); rect.setAttribute('height', Math.max(0, q.h));
      rect.setAttribute('class', q.class);
      svg.appendChild(rect);
    });
    
    // Axes Lines
    const xLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    xLine.setAttribute('x1', ox); xLine.setAttribute('y1', padding);
    xLine.setAttribute('x2', ox); xLine.setAttribute('y2', h - padding);
    xLine.setAttribute('class', 'axis-line');
    svg.appendChild(xLine);
    
    const yLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    yLine.setAttribute('x1', padding); yLine.setAttribute('y1', oy);
    yLine.setAttribute('x2', w - padding); yLine.setAttribute('y2', oy);
    yLine.setAttribute('class', 'axis-line');
    svg.appendChild(yLine);
    
    // Labels
    const labels = [
      {x: w-padding-6, y: padding+14,   t: '1사분면 (외부/내부 모두 취약)', c: '#a8322a', a:'end'},   // 우상단 구석
      {x: padding+6,   y: padding+14,   t: '2사분면 (내부 잔존/순환 위험)', c: '#9a6a12', a:'start'}, // 좌상단 구석
      {x: padding+6,   y: h-padding-6,  t: '3사분면 (상대적 안전구역)',     c: '#1e7e34', a:'start'}, // 좌하단 구석
      {x: w-padding-6, y: h-padding-6,  t: '4사분면 (외부 유입 위험 높음)', c: '#9a6a12', a:'end'}     // 우하단 구석
    ];
    labels.forEach(l => {
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', l.x); txt.setAttribute('y', l.y);
        txt.setAttribute('text-anchor', l.a);
        txt.setAttribute('font-size', '11px');
        txt.setAttribute('font-weight', 'bold');
        txt.setAttribute('fill', l.c);
        txt.textContent = l.t;
        svg.appendChild(txt);
    });
    
    // Axis Titles
    const xt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    xt.setAttribute('x', w/2); xt.setAttribute('y', h - 15);
    xt.setAttribute('class', 'axis-label');
    xt.textContent = '외부 유입 위험도 (높을수록 위험 ➔)';
    svg.appendChild(xt);
    
    const yt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    yt.setAttribute('x', -h/2); yt.setAttribute('y', 20);
    yt.setAttribute('class', 'axis-label');
    yt.setAttribute('transform', 'rotate(-90)');
    yt.textContent = '내부 순환 위험도 (높을수록 위험 ➔)';
    svg.appendChild(yt);
    
    // Draw Dots
    data.forEach(d => {
      const cx = scaleX(d.extRisk);
      const cy = scaleY(d.intRisk);
      
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
      dot.setAttribute('r', d.fid === selectedId ? 9 : 6);
      
      // Color based on lineage to see patterns
      let fill = '#46505e';
      if(d.lin_str.includes('JBNU')) fill = '#C6531B'; // regional dominant
      else if(d.lin_str.includes('NA73') || d.lin_str.includes('K07')) fill = '#7B5EA7'; // intro
      else if(d.lin_str.includes('음성')) fill = '#70AD47';
      else if(d.lin_str.includes('백신')) fill = '#4E79A7';
      
      dot.setAttribute('fill', fill);
      dot.setAttribute('class', 'dot' + (d.fid === selectedId ? ' selected' : ''));
      dot.onclick = () => selectFarm(d);
      dot.onmouseover = (e) => {
          tt.style.opacity = 1;
          tt.style.left = (e.offsetX + 10) + 'px';
          tt.style.top = (e.offsetY + 10) + 'px';
          tt.textContent = d.name + ' (' + d.lin_str.split(' ')[0] + ')';
      };
      dot.onmouseout = () => tt.style.opacity = 0;
      g.appendChild(dot);

      // 기준농장(최저위험) 특별 표식: 금색 링 + 별 마커 + 라벨
      if(d.fid === benchmark.fid) {
          const baseR = (d.fid === selectedId ? 9 : 6);
          const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          ring.setAttribute('cx', cx); ring.setAttribute('cy', cy);
          ring.setAttribute('r', baseR + 5);
          ring.setAttribute('fill', 'none');
          ring.setAttribute('stroke', '#E0A800');
          ring.setAttribute('stroke-width', '2.5');
          g.appendChild(ring);

          const sy = cy - (baseR + 16);
          let pts = '';
          for(let i = 0; i < 10; i++){
              const ang = (-90 + i * 36) * Math.PI / 180;
              const rr = i % 2 ? 2.8 : 7;
              pts += (cx + rr * Math.cos(ang)) + ',' + (sy + rr * Math.sin(ang)) + ' ';
          }
          const star = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          star.setAttribute('points', pts.trim());
          star.setAttribute('fill', '#E0A800');
          star.setAttribute('stroke', '#fff');
          star.setAttribute('stroke-width', '1');
          g.appendChild(star);

          const lab = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          lab.setAttribute('x', cx); lab.setAttribute('y', sy - 9);
          lab.setAttribute('text-anchor', 'middle');
          lab.setAttribute('font-size', '10px');
          lab.setAttribute('font-weight', 'bold');
          lab.setAttribute('fill', '#9a6a12');
          lab.textContent = '기준농장';
          g.appendChild(lab);
      }

      if(d.fid === selectedId) {
          const dt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          dt.setAttribute('x', cx); dt.setAttribute('y', cy - 14);
          dt.setAttribute('class', 'dot-label');
          dt.setAttribute('fill', '#1F3864');
          dt.setAttribute('font-weight', 'bold');
          dt.textContent = d.name;
          g.appendChild(dt);
      }
      
      svg.appendChild(g);
    });
  }
  
  function getQuad(x, y) {
      if(x >= originX && y >= originY) return {q:1, name:'1사분면 (외부·내부 복합 위험)', bg:'bg-red'};
      if(x < originX && y >= originY) return {q:2, name:'2사분면 (내부 잔존/순환 취약)', bg:'bg-orange'};
      if(x < originX && y < originY) return {q:3, name:'3사분면 (안전 구역)', bg:'bg-green'};
      return {q:4, name:'4사분면 (외부 유입 취약)', bg:'bg-orange'};
  }
  
  function selectFarm(d) {
      selectedId = d.fid;
      draw();
      
      const qInfo = getQuad(d.extRisk, d.intRisk);
      const sRank = getSafeRank(d);

      // 최저위험 기준농장 대비 격차
      const isBench = d.fid === benchmark.fid;
      const extGap = Math.max(0, d.extRisk - benchmark.extRisk);
      const intGap = Math.max(0, d.intRisk - benchmark.intRisk);
      const facs = gapFactors(d).filter(x => x.raw > 0).sort((a,b) => b.norm - a.norm);

      const fb = document.getElementById('feedback');
      
      // Determine Lineage insight
      let linInsight = "";
      if(d.lin_str.includes('JBNU-22') || d.lin_str.includes('JBNU-20')) {
          linInsight = `<b>지역 우점 클레이드 감염</b><br>반경 3km 내 도축장/길목 등 물리적 이동망을 공유하는 20여개 농장과 같은 바이러스입니다. <b>(차량 매개 수평전파)</b>`;
      } else if (d.lin_str.includes('NA73') || d.lin_str.includes('K07')) {
          linInsight = `<b>독립적 유입계통 (소수 분지)</b><br>지역망과 별개로 후보돈(종돈장)이나 수의사/장비기사 등 인적 요인을 통한 <b>외부 단독 유입</b>일 확률이 높습니다.`;
      } else if (d.lin_str.includes('음성')) {
          linInsight = `<b>음성/안정 상태</b><br>현재 바이러스가 검출되지 않습니다. 방어에 성공 중입니다.`;
      } else {
          linInsight = `<b>백신주/기타</b><br>야외주보다는 백신 계열이 검출되거나 분류가 명확하지 않습니다.`;
      }
      
      let html = `
        <h2>${d.name} <span style="font-size:14px; color:#6b7686; font-weight:normal;">(${d.sigun})</span></h2>
        
        <div class="badge ${qInfo.bg}">${qInfo.name}</div>
        <div class="badge bg-blue">안전도 상위 ${sRank.pct}% (40농장 중 ${sRank.rank}위)</div>
        
        <div class="f-section">
            <h3>복합 위험도 지수</h3>
            <div style="display:flex; gap:10px;">
                <div class="box" style="flex:1; text-align:center;"><b>외부 위험</b><br><span style="font-size:20px; color:${d.extRisk > originX ? '#d9534f' : '#28a745'}">${d.extRisk.toFixed(1)}</span></div>
                <div class="box" style="flex:1; text-align:center;"><b>내부 위험</b><br><span style="font-size:20px; color:${d.intRisk > originY ? '#d9534f' : '#28a745'}">${d.intRisk.toFixed(1)}</span></div>
            </div>
        </div>

        ${ isBench ? `
        <div class="f-section">
            <h3>최저위험 기준 농장</h3>
            <div class="box" style="border-left:3px solid #1e7e34;">
                이 농장이 바로 <b>내·외부 위험 합산이 가장 낮은 기준 농장</b>입니다.<br>
                현재 방역 수준(외부 ${d.extRisk.toFixed(1)} · 내부 ${d.intRisk.toFixed(1)})을 유지·관리하세요.
            </div>
        </div>` : `
        <div class="f-section">
            <h3>최저위험 농장 대비 격차 분석</h3>
            <div class="box">
                <div style="font-size:13px; margin-bottom:10px;">기준농장 <b>${benchmark.name}</b> 대비 (외부 ${benchmark.extRisk.toFixed(1)} · 내부 ${benchmark.intRisk.toFixed(1)})</div>
                ${gapBar('외부 위험 격차', extGap, RANGES.extRisk, '#C6531B')}
                ${gapBar('내부 위험 격차', intGap, RANGES.intRisk, '#9a6a12')}
                <div style="margin-top:12px; padding:10px; background:#fdeaea; border-radius:6px; font-size:13px;">
                    <b>가장 큰 차이:</b> ${facs.length ? `${facs[0].label} <span style="color:#a8322a; font-weight:600;">(우리 ${facs[0].cur} → 기준 ${facs[0].tgt})</span>` : '뚜렷한 격차 없음 (이미 기준에 근접)'}
                </div>
            </div>
        </div>
        ${ facs.length ? `
        <div class="f-section">
            <h3>기준농장 수준 도달 개선 과제 (우선순위)</h3>
            ${facs.slice(0,3).map((x,i) => `
            <div class="box action" style="margin-bottom:8px;">
                <b>${i+1}. ${x.label}</b> <span style="font-size:12px; color:#6b7686;">현재 ${x.cur} → 목표 ${x.tgt}</span><br>
                <span style="font-size:13px;">${x.action}</span>
            </div>`).join('')}
        </div>` : '' }
        `}

        <div class="f-section">
            <h3>주요 취약 요소 (Factor)</h3>
            <div class="box">
                <ul>
                    ${d.vul_list.map(v => `<li>${v}</li>`).join('')}
                </ul>
            </div>
        </div>
        
        <div class="f-section">
            <h3>리니지(계통) 기반 전염 패턴 분석</h3>
            <div class="box">
                <span style="display:inline-block; margin-bottom:4px; font-size:12px; background:#e3e6ea; padding:2px 6px; border-radius:4px;">검출주: ${d.lin_str}</span><br>
                ${linInsight}
            </div>
        </div>
        
        <div class="f-section">
            <h3>우선 개선 과제 및 기대효과</h3>
            <div class="box action">
                ${qInfo.q === 1 ? '차량 동선 분리 및 돈사간 장화 갈아신기부터 즉시 도입. (유입/순환 동시 차단)' : 
                  qInfo.q === 2 ? '내부 잔존 바이러스가 돕니다. 올인올아웃 엄수 및 돈사별 전용 장비/작업복 도입 필수.' : 
                  qInfo.q === 3 ? '현재 방역 수준 유지 및 후보돈 순치 SOP 강화.' : 
                  '3km 내 인접 농장으로부터의 교차오염 대비. 사료차/출하차 외부 통제벽 설치 시급.'}
            </div>
        </div>

        <div class="f-section">
            <h3>경제적 효과</h3>
            <div class="box">추적 연구 필요</div>
        </div>
      `;
      fb.innerHTML = html;
  }
  
  function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-avg').classList.toggle('active', mode === 'average');
      document.getElementById('btn-safe').classList.toggle('active', mode === 'safe');
      
      if(mode === 'average') {
          originX = avgX;
          originY = avgY;
      } else {
          originX = safeX;
          originY = safeY;
      }
      draw();
      
      // re-render selected farm to update quadrant tag
      if(selectedId) {
          const f = data.find(x => x.fid === selectedId);
          if(f) selectFarm(f);
      }
  }
  
  window.addEventListener('resize', draw);
  setTimeout(draw, 100);

</script>
</body>
</html>
