<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRRSV 통합 분석 대시보드 — 경기 이천·여주</title>
<style>
:root{--ink:#1f2733;--mut:#6b7686;--line:#e3e6ea;--accent:#1F3864}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#eef0f3;color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px 0}
h1{font-size:19px;margin:0 0 3px}.sub{color:var(--mut);font-size:12.5px;margin:0 0 12px}
.tabs{display:flex;gap:4px}
.tab{padding:10px 18px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;background:#f1f3f6;color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer}
.tab.on{background:#fff;color:var(--accent);border-color:var(--accent);border-bottom:2px solid #fff;margin-bottom:-1px}
.tab span{display:block;font-size:10.5px;color:var(--mut);font-weight:400;margin-top:2px}
.tab.on span{color:var(--accent)}
.frames{position:relative}
iframe{width:100%;height:calc(100vh - 96px);border:none;background:#f4f5f7;display:none}
iframe.on{display:block}
</style></head><body>
<header>
<h1>PRRSV 통합 분석 대시보드</h1>
<p class="sub">경기 이천·여주 양돈장 · PCR/유전자분석 + 현지 차단방역 설문 · 유입경로 추정 → 계통수 검증 → 지리 분포를 한 곳에서</p>
<div class="tabs">
<div class="tab on" data-f="0">① 추정 유입경로<span>2층 모델·AHP·차단방역</span></div>
<div class="tab" data-f="1">② 계통수 검증<span>실제 ORF5 트리 vs K-means</span></div>
<div class="tab" data-f="2">③ 계통 × 지리 분포<span>수평전파 지도</span></div>
</div>
</header>
<div class="frames">
<iframe class="on" src="dash_routes.html"></iframe>
<iframe src="dash_tree.html"></iframe>
<iframe src="dash_map.html"></iframe>
</div>
<script>
const tabs=[...document.querySelectorAll('.tab')],fr=[...document.querySelectorAll('iframe')];
tabs.forEach(t=>t.onclick=()=>{const i=+t.dataset.f;tabs.forEach(x=>x.classList.toggle('on',x===t));fr.forEach((f,j)=>f.classList.toggle('on',j===i))});
</script></body></html>
